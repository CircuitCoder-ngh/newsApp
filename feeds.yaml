    region: Americas
    feeds:
      - {topic: world, url: "https://feeds.npr.org/1004/rss.xml"}
      - {topic: business, url: "https://feeds.npr.org/1006/rss.xml"}
      - {topic: science, url: "https://feeds.npr.org/1007/rss.xml"}
      - {topic: science, url: "https://feeds.npr.org/1128/rss.xml"}

  - name: New York Times
    region: Americas
