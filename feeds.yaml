# News sources. Each outlet lists one or more feeds tagged with a topic:
#   world    - world news and politics
#   business - business and economy
#   science  - science, technology and health
# Feeds are fetched in the order listed; when the same article appears in two
# feeds of one outlet, the first feed's topic wins.
#
# exclude_url_patterns / exclude_title_patterns are case-insensitive regexes.
# The defaults apply to every outlet; an outlet's own patterns are added on top.
# Run `python -m pipeline check-feeds` after editing.

defaults:
  exclude_url_patterns:
    - /videos?/
    - /live/
    - /podcasts?/
    - /audio/
    - /av/
    - /sounds/
    - /opinion/
    - /commentisfree/
    - /sports?/
    - /football/
    - /cricket/
    - /culture/
    - /entertainment/
    - /lifestyle/
    - /gallery/
    - /in-pictures/
    - /quiz
  exclude_title_patterns:
    - '^(live|watch|quiz|photos?|in pictures|video|podcast|opinion)\b'
    - '\b(crossword|wordle|sudoku)\b'

outlets:
  # --- Europe ---
  - name: BBC News
    region: Europe
    feeds:
      - {topic: world, url: "https://feeds.bbci.co.uk/news/world/rss.xml"}
      - {topic: business, url: "https://feeds.bbci.co.uk/news/business/rss.xml"}
      - {topic: science, url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"}
      - {topic: science, url: "https://feeds.bbci.co.uk/news/technology/rss.xml"}
      - {topic: science, url: "https://feeds.bbci.co.uk/news/health/rss.xml"}

  - name: The Guardian
    region: Europe
    feeds:
      - {topic: world, url: "https://www.theguardian.com/world/rss"}
      - {topic: business, url: "https://www.theguardian.com/business/rss"}
      - {topic: science, url: "https://www.theguardian.com/science/rss"}
      - {topic: science, url: "https://www.theguardian.com/technology/rss"}

  - name: Sky News
    region: Europe
    feeds:
      - {topic: world, url: "https://feeds.skynews.com/feeds/rss/world.xml"}

  - name: DW
    region: Europe
    feeds:
      - {topic: world, url: "https://rss.dw.com/rdf/rss-en-world"}
      - {topic: business, url: "https://rss.dw.com/rdf/rss-en-bus"}

  - name: France 24
    region: Europe
    feeds:
      - {topic: world, url: "https://www.france24.com/en/rss"}
      - {topic: business, url: "https://www.france24.com/en/business-tech/rss"}

  - name: RFI
    region: Europe
    feeds:
      - {topic: world, url: "https://www.rfi.fr/en/rss"}

  - name: Euronews
    region: Europe
    feeds:
      - {topic: world, url: "https://www.euronews.com/rss?format=mrss&level=theme&name=news"}

  # --- Americas ---
