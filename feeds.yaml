      - {topic: business, url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml"}
      - {topic: science, url: "https://rss.nytimes.com/services/xml/rss/nyt/Science.xml"}
      - {topic: science, url: "https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml"}
      - {topic: science, url: "https://rss.nytimes.com/services/xml/rss/nyt/Health.xml"}

  - name: ABC News
