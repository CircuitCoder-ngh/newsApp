[project]
name = "news-timeline"
version = "0.1.0"
description = "Scans world news feeds hourly and publishes a merged, linked timeline of events."
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.4",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
